<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Script Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gisLoaded && window.__gisLoaded()"></script>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#cdd3da; --page:#ffffff; --ink:#1b1d21; --muted:#5d636d; --faint:#b6bcc4;
  --bar:rgba(236,239,242,.9); --line:#c3c9d1; --pill:#e3e7ec; --pill-ink:#2b2f35;
  --on:#1b1d21; --on-ink:#ffffff; --brass:#a8823a; --brass-hi:#d9b86a;
  --shadow:0 1px 1px rgba(20,24,30,.08), 0 12px 32px rgba(20,24,30,.12);
  --ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"Courier Prime", "Courier New", Courier, monospace;
  --fs:min(17px, calc((100vw - 20px) / 39.5));
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#121418; --page:#1f2227; --ink:#e7e9ec; --muted:#9aa1ab; --faint:#4a5059;
    --bar:rgba(24,26,30,.9); --line:#2f333a; --pill:#2a2e34; --pill-ink:#d6dae0;
    --on:#e7e9ec; --on-ink:#15171a; --brass:#b8924a; --brass-hi:#e2c47e;
    --shadow:0 0 0 1px #2a2e34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#121418; --page:#1f2227; --ink:#e7e9ec; --muted:#9aa1ab; --faint:#4a5059;
  --bar:rgba(24,26,30,.9); --line:#2f333a; --pill:#2a2e34; --pill-ink:#d6dae0;
  --on:#e7e9ec; --on-ink:#15171a; --brass:#b8924a; --brass-hi:#e2c47e;
  --shadow:0 0 0 1px #2a2e34;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--hdr, 110px) + 12px)}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}

header{
  position:fixed;top:0;left:0;right:0;z-index:20;
  background:var(--bar);
  -webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
}
.row{display:flex;align-items:center;gap:8px;max-width:980px;margin:0 auto}
.row + .row{margin-top:8px}
#title{flex:1;min-width:0;font:600 17px/1.2 var(--ui);color:var(--ink);background:transparent;border:0;padding:9px 8px;border-radius:8px;outline:none}
#title::placeholder{color:var(--muted)}
#title:focus{background:var(--pill)}
#status{font-size:13px;color:var(--muted);white-space:nowrap}
#pages{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
button{font-family:var(--ui);-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.icon{width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent;color:var(--pill-ink);border-radius:10px;padding:0}
.icon:disabled{opacity:.3;cursor:default}
.icon:not(:disabled):active{background:var(--pill)}
.textbtn{height:42px;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--pill-ink);border-radius:10px;font-size:15px;font-weight:500;white-space:nowrap}
.textbtn.armed{background:#b3261e;border-color:#b3261e;color:#fff}
.fmt{display:flex;gap:2px;flex:0 0 auto;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.fmt .icon{font-size:17px}
.fmt .icon[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.types{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.types::-webkit-scrollbar{display:none}
.type{flex:0 0 auto;height:42px;padding:0 16px;border:0;border-radius:21px;background:var(--pill);color:var(--pill-ink);font-size:15px;font-weight:500}
.type[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
#hint{font-size:13px;color:var(--muted);white-space:nowrap;opacity:.75;padding-right:10px;margin-right:2px;border-right:1px solid var(--line)}
@media (max-width:980px){#hint{display:none}}
@media (max-width:520px){#status{display:none}}

[hidden]{display:none !important}
.textbtn.primary{background:var(--on);color:var(--on-ink);border-color:transparent}
.notice{flex-wrap:wrap;background:var(--pill);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px}
.notice span{flex:1;min-width:200px}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,12,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top, 0px) + 64px) 16px 16px}
.sheet{background:var(--page);color:var(--ink);width:100%;max-width:520px;max-height:70vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:600 17px var(--ui)}
.list{overflow:auto;padding:6px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line)}
.sheet-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.sheet-foot span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:13px 12px;border-radius:10px;font-size:16px}
.item:hover,.item:active{background:var(--pill)}
.item.current span{font-weight:600}
.item small{color:var(--muted);font-size:13px;white-space:nowrap}
.empty{padding:18px;color:var(--muted);font-size:15px;line-height:1.4;margin:0}
.tp-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:.45em;width:100%;max-width:39.5em;margin:0 auto 16px;padding:2.2em 1.75em 1.8em;font-size:var(--fs);font-family:var(--mono);color:var(--ink);background:var(--page);border:0;border-radius:2px;box-shadow:var(--shadow);text-align:center}
.tp-card .tp-label{position:absolute;top:10px;left:14px;font:500 12px var(--ui);color:var(--muted)}
.tp-card .tp-title{font-weight:700;text-transform:uppercase}
.tp-card .tp-empty{font:15px var(--ui);color:var(--muted)}
.form{overflow:auto;padding:14px 18px 20px;display:grid;gap:14px}
.form label{display:grid;gap:6px;font:500 14px var(--ui);color:var(--muted)}
.form label small{font-weight:400}
.form input,.form textarea{width:100%;font:16px/1.35 var(--ui);color:var(--ink);background:var(--pill);border:1px solid transparent;border-radius:10px;padding:10px 12px;resize:vertical}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--brass)}
.findbar{flex-wrap:wrap}
.findbar input{flex:1 1 160px;min-width:0;height:40px;font:16px var(--ui);color:var(--ink);background:var(--pill);border:1px solid transparent;border-radius:10px;padding:0 12px}
.findbar input:focus{outline:none;border-color:var(--brass)}
#findCount{font-size:13px;color:var(--muted);min-width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
::highlight(find){background:rgba(217,184,106,.35)}
::highlight(find-now){background:#d9b86a;color:#1b1d21}
.sheet.wide{max-width:760px;max-height:80vh}
.panel-body{padding:8px 14px 18px}
.panel-body h3{font:600 15px var(--ui);margin:16px 4px 8px}
.panel-body h3:first-child{margin-top:6px}
.panel-body p{margin:6px 4px;color:var(--muted);font-size:14px;line-height:1.4}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--muted);font-weight:500}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.scene-row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.scene-row .item{flex:1;min-width:0;font-family:var(--mono);font-size:14px}
.scene-row .item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.scene-row .icon:disabled{opacity:.25}
.draft-new{display:flex;gap:8px;margin:4px 4px 10px}
.draft-new input{flex:1;min-width:0;height:42px;font:16px var(--ui);color:var(--ink);background:var(--pill);border:1px solid transparent;border-radius:10px;padding:0 12px}
.draft-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.draft-row .meta{flex:1 1 200px;min-width:0}
.draft-row .meta b{display:block;font-weight:600}
.draft-row .meta small{color:var(--muted)}
.diff{font:13px/1.45 var(--mono);margin:4px}
.diff div{padding:2px 8px;border-radius:4px;white-space:pre-wrap}
.diff .add{background:rgba(46,160,67,.16)}
.diff .del{background:rgba(207,34,46,.14);text-decoration:line-through;color:var(--muted)}
.diff .gap{color:var(--muted);font-family:var(--ui);font-style:italic}
.diff .t{display:inline-block;min-width:6.5em;color:var(--muted);font-family:var(--ui);font-size:12px}
.suggest{position:fixed;z-index:30;min-width:200px;max-width:min(380px, 90vw);background:var(--page);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px}
.suggest button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:transparent;color:var(--ink);border-radius:7px;font:15px var(--mono);text-transform:uppercase}
.suggest button[aria-selected="true"]{background:var(--pill)}
.rail{position:fixed;top:0;height:100%;width:var(--rail);z-index:20;display:flex;flex-direction:column;gap:8px;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) 8px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background:var(--bar);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#railL{left:0;padding-left:max(8px, env(safe-area-inset-left, 0px));border-right:1px solid var(--line)}
#railR{right:0;padding-right:max(8px, env(safe-area-inset-right, 0px));border-left:1px solid var(--line)}
.rail > *{flex:none}
.rail .rail-label{font:500 12px var(--ui);color:var(--muted);margin:6px 2px -2px}
.rail .pair{display:flex;justify-content:space-between;gap:4px}
.rail .pair .icon{flex:1}
.rail .fmt{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0;margin:0;border:0}
.rail .fmt .icon{width:auto}
.rail .types{flex-direction:column;overflow:visible;gap:6px}
.rail .type{width:100%;padding:0 6px;font-size:13px;border-radius:12px}
.rail .textbtn{width:100%;height:auto;min-height:42px;padding:6px;font-size:14px;line-height:1.2;white-space:normal}
.rail .textbtn.tool-b{font-size:13px;min-height:38px}
.rail #title{flex:none;width:100%;font-size:15px;padding:9px 8px;background:var(--pill);white-space:nowrap;text-overflow:ellipsis}
.rail #pages,.rail #status{display:block;white-space:normal;text-align:center;font-size:12px;line-height:1.35}
.rail #fullBtn{width:100%}
html.rails{--rail:112px;--fs:min(17px, calc((100vw - 2 * var(--rail) - 24px) / 39.5))}
html.rails main{padding-left:calc(var(--rail) + 12px);padding-right:calc(var(--rail) + 12px)}
html.rails header{left:var(--rail);right:var(--rail)}
html.rails #hint{display:none}
main{padding:calc(var(--hdr, 110px) - env(safe-area-inset-top, 0px) + 22px) 10px 0}
.page{
  position:relative;font-size:var(--fs);font-family:var(--mono);
  width:100%;max-width:39.5em;min-height:80vh;margin:0 auto 40vh;
  padding:3em 1.75em 6em;background:var(--page);box-shadow:var(--shadow);border-radius:2px;
}
/* the two brass brads of a bound script */
.page::before{
  content:"";position:absolute;left:.55em;top:0;bottom:0;width:.7em;pointer-events:none;
  background:
    radial-gradient(circle at 40% 38%, var(--brass-hi) 0 18%, var(--brass) 40% 46%, transparent 52%) 0 4.2em / .7em .7em no-repeat,
    radial-gradient(circle at 40% 38%, var(--brass-hi) 0 18%, var(--brass) 40% 46%, transparent 52%) 0 calc(100% - 4.2em) / .7em .7em no-repeat;
}
.editor{
  width:60ch;max-width:100%;margin:0 auto;min-height:60vh;outline:none;
  line-height:1.35;white-space:pre-wrap;overflow-wrap:break-word;caret-color:var(--brass);color:var(--ink);
}
.el{position:relative;margin:1.35em 0 0}
.el:first-child{margin-top:0}
.el[data-type="scene"]{text-transform:uppercase;font-weight:700;margin-top:2.7em}
.el[data-type="scene"]:first-child{margin-top:0}
.el[data-type="character"]{text-transform:uppercase;margin-left:22ch}
.el{--ind:0ch}
.el[data-type="character"]{--ind:22ch}
.el[data-type="paren"]{--ind:16ch}
.el[data-type="dialogue"]{--ind:10ch}
.el[data-pg]:not(.blank)::before{content:attr(data-pg);position:absolute;top:-.8em;left:calc(-1 * var(--ind) - 1.75em);width:calc(60ch + 3.5em);border-top:1px dashed var(--faint);padding:3px 0 0 4px;font:600 11px/1 var(--ui);color:var(--muted);pointer-events:none;text-align:left;font-style:normal;text-transform:none}
.el[data-type="dialogue"][data-pg]:not(.blank),.el[data-type="paren"][data-pg]:not(.blank){margin-top:.9em}
.el[data-type="character"].contd::after{content:" (CONT'D)";color:var(--muted)}
.el.dual{background:rgba(168,130,58,.12);border-radius:3px}
.el[data-type="scene"][data-sn]::after{content:attr(data-sn);position:absolute;top:0;right:-1.6em;font-weight:400;color:var(--muted)}
.el[data-type="scene"][data-sn]{padding-right:.2em}
.el[data-type="paren"]{margin:0 19ch 0 16ch}
.el[data-type="dialogue"]{margin:0 15ch 0 10ch}
.el[data-type="transition"]{text-transform:uppercase;text-align:right}
.el[data-type="shot"]{text-transform:uppercase}
.el[data-type="note"]{font-style:italic;color:var(--muted)}
.fb{font-weight:700}
.fi{font-style:italic}
.fu{text-decoration:underline}
.fs{text-decoration:line-through}
.fu.fs{text-decoration:underline line-through}
.el.blank::before{position:absolute;left:0;right:0;top:0;color:var(--faint);pointer-events:none;font-weight:400}
.el.blank[data-type="scene"]::before{content:"INT. LOCATION – DAY"}
.el.blank[data-type="action"]::before{content:"Action"}
.el.blank[data-type="character"]::before{content:"Character"}
.el.blank[data-type="paren"]::before{content:"(beat)"}
.el.blank[data-type="dialogue"]::before{content:"Dialogue"}
.el.blank[data-type="transition"]::before{content:"Cut to:"}
.el.blank[data-type="shot"]::before{content:"Close on"}
.el.blank[data-type="note"]::before{content:"Note to self"}
</style>
</head>
<body>
<header>
  <div class="row" id="rowMain">
    <input id="title" type="text" placeholder="Untitled script" aria-label="Script title" autocomplete="off" spellcheck="false">
    <span id="pages"></span>
    <span id="hint"></span>
    <span id="status" aria-live="polite"></span>
    <button class="icon" id="undo" aria-label="Undo" title="Undo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="icon" id="redo" aria-label="Redo" title="Redo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button class="textbtn" id="open">Files</button>
    <button class="textbtn" id="toolsBtn">Tools</button>
    <button class="textbtn" id="new">New</button>
    <button class="textbtn primary" id="drive">Connect Drive</button>
    <button class="icon" id="fullBtn" aria-label="Full screen" title="Full screen" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>
  <div class="row findbar" id="findBar" hidden>
    <input id="findIn" type="search" placeholder="Find" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Find">
    <input id="replIn" type="text" placeholder="Replace with" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Replace with">
    <span id="findCount"></span>
    <button class="icon" id="findPrev" aria-label="Previous match"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
    <button class="icon" id="findNext" aria-label="Next match"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="textbtn" id="replOne">Replace</button>
    <button class="textbtn" id="replAll">Replace all</button>
    <button class="textbtn" id="findClose">Done</button>
  </div>
  <div class="row notice" id="conflict" hidden>
    <span>This script was changed on another device.</span>
    <button class="textbtn" id="useDrive">Use Drive version</button>
    <button class="textbtn" id="keepMine">Keep this version</button>
  </div>
  <div class="row" id="rowTypes">
    <div class="fmt" role="toolbar" aria-label="Text style">
      <button class="icon" data-fmt="b" aria-label="Bold" aria-pressed="false"><b>B</b></button>
      <button class="icon" data-fmt="i" aria-label="Italic" aria-pressed="false"><i style="font-family:Georgia,serif">I</i></button>
      <button class="icon" data-fmt="u" aria-label="Underline" aria-pressed="false"><u>U</u></button>
      <button class="icon" data-fmt="s" aria-label="Strikethrough" aria-pressed="false"><s>S</s></button>
    </div>
    <div class="types" role="toolbar" aria-label="Line type">
      <button class="type" data-type="scene">Scene</button>
      <button class="type" data-type="action">Action</button>
      <button class="type" data-type="character">Character</button>
      <button class="type" data-type="paren">Parenthetical</button>
      <button class="type" data-type="dialogue">Dialogue</button>
      <button class="type" data-type="transition">Transition</button>
      <button class="type" data-type="shot">Shot</button>
      <button class="type" data-type="note">Note</button>
    </div>
  </div>
</header>
<nav class="rail" id="railL" aria-label="Writing tools" hidden></nav>
<aside class="rail" id="railR" aria-label="Script and files" hidden></aside>

<main>
  <button class="tp-card" id="tpCard" type="button" aria-label="Edit title page">
    <span class="tp-label">Title page</span>
    <span class="tp-title" id="tpCardTitle"></span>
    <span id="tpCardCredit"></span>
    <span id="tpCardAuthor"></span>
    <span class="tp-empty" id="tpCardEmpty">Add a title page</span>
  </button>
  <div class="page">
    <div id="editor" class="editor" contenteditable="true" spellcheck="true" autocapitalize="sentences" autocorrect="on" role="textbox" aria-multiline="true" aria-label="Screenplay"></div>
  </div>
</main>

<div class="overlay" id="picker" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="sheet-head">
      <h2 id="pickerTitle">Files</h2>
      <button class="textbtn" id="closePicker">Close</button>
    </div>
    <div class="sheet-actions">
      <button class="textbtn" id="importBtn">Import</button>
      <button class="textbtn" id="pdfBtn">Download PDF</button>
      <button class="textbtn" id="exportBtn">Download FDX</button>
      <button class="textbtn" id="fountainBtn">Download Fountain</button>
    </div>
    <div class="list" id="pickerList"></div>
    <div class="sheet-foot" id="acctRow" hidden>
      <span id="acctName">Connected to Google Drive</span>
      <button class="textbtn" id="disconnect">Disconnect</button>
    </div>
  </div>
</div>
<div class="overlay" id="tpSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tpHead">
    <div class="sheet-head">
      <h2 id="tpHead">Title page</h2>
      <button class="textbtn primary" id="tpDone">Done</button>
    </div>
    <div class="form">
      <label>Title<input id="tpTitle" type="text" autocomplete="off" placeholder="Untitled script"></label>
      <label>Credit<input id="tpCredit" type="text" autocomplete="off" placeholder="Written by"></label>
      <label>Author<input id="tpAuthor" type="text" autocomplete="off" placeholder="Your name"></label>
      <label>Based on <small>(optional)</small><input id="tpSource" type="text" autocomplete="off" placeholder="Based on the novel by…"></label>
      <label>Contact details<textarea id="tpContact" rows="3" placeholder="Email, phone or agent"></textarea></label>
      <label>Draft and date<textarea id="tpDraft" rows="2" placeholder="First draft&#10;October 2026"></textarea></label>
    </div>
  </div>
</div>
<div class="overlay" id="toolsSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="toolsHead">
    <div class="sheet-head"><h2 id="toolsHead">Tools</h2><button class="textbtn" id="toolsClose">Close</button></div>
    <div class="list">
      <button class="item tool" data-tool="find"><span>Find and replace</span><small id="findKey"></small></button>
      <button class="item tool" data-tool="scenes"><span>Scenes</span><small>Jump to or reorder</small></button>
      <button class="item tool" data-tool="reports"><span>Reports</span><small>Characters, places, scenes</small></button>
      <button class="item tool" data-tool="drafts"><span>Drafts</span><small>Save and compare versions</small></button>
      <button class="item tool" data-tool="dual"><span>Dual dialogue</span><small>Pair this speech with the one before</small></button>
      <button class="item tool" data-tool="numbers"><span>Scene numbers</span><small id="snState">Off</small></button>
      <button class="item tool" data-tool="rails"><span>Side toolbars</span><small id="railState">Off</small></button>
    </div>
  </div>
</div>
<div class="overlay" id="panel" hidden>
  <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="panelHead">
    <div class="sheet-head"><h2 id="panelHead"></h2><button class="textbtn" id="panelClose">Close</button></div>
    <div class="list panel-body" id="panelBody"></div>
  </div>
</div>
<div class="suggest" id="suggest" role="listbox" aria-label="Suggestions" hidden></div>
<input type="file" id="importInput" hidden>

<script>
(() => {
  const TYPES = ['scene','action','character','paren','dialogue','transition','shot','note'];
  const LABELS = {scene:'Scene',action:'Action',character:'Character',paren:'Parenthetical',dialogue:'Dialogue',transition:'Transition',shot:'Shot',note:'Note'};
  const ENTER_NEXT = {scene:'action',action:'action',character:'dialogue',paren:'dialogue',dialogue:'action',transition:'scene',shot:'action',note:'action'};
  const SCENE_RE = /^(int|ext|i\/e|int\.?\s?\/\s?ext)[.\s]/i;
  const KEY = 'script-editor:draft:v1';

  const editor = document.getElementById('editor');
  const hdr = document.querySelector('header');
  const titleEl = document.getElementById('title');
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const undoBtn = document.getElementById('undo');
  const redoBtn = document.getElementById('redo');
  const newBtn = document.getElementById('new');
  const typeBtns = [...document.querySelectorAll('.type')];
  const fmtBtns = [...document.querySelectorAll('.fmt button')];

  /* ---------- blocks ---------- */
  const txt = b => b.textContent.replace(/\u200b/g, '');
  const blocks = () => [...editor.children];

  // A line's text is a list of runs: {t:text, f:flags} where flags use b i u s
  const FLAGS = 'bius';
  const normFlags = f => FLAGS.split('').filter(c => f.includes(c)).join('');
  const xorFlags = (a, b) => { let f = a; for (const c of b) f = f.includes(c) ? f.replace(c, '') : f + c; return normFlags(f); };
  const clsOf = f => f.split('').map(c => 'f' + c).join(' ');
  const runsText = runs => runs.map(r => r.t).join('');
  function mergeRuns(runs) {
    const out = [];
    for (const r of runs) {
      if (!r.t) continue;
      const last = out[out.length - 1];
      if (last && last.f === r.f) last.t += r.t; else out.push({t:r.t, f:r.f});
    }
    return out;
  }
  function sliceRuns(runs, a, z = Infinity) {
    const out = []; let pos = 0;
    for (const r of runs) {
      const s0 = pos, e0 = pos + r.t.length; pos = e0;
      const x = Math.max(a, s0), y = Math.min(z, e0);
      if (y > x) out.push({t:r.t.slice(x - s0, y - s0), f:r.f});
    }
    return out;
  }
  function styleAt(runs, off) {
    let pos = 0;
    for (const r of runs) { if (off > pos && off <= pos + r.t.length) return r.f; pos += r.t.length; }
    return runs.length && off === 0 ? runs[0].f : '';
  }
  function runsFrom(text, fmt) {
    text = text || '';
    if (!Array.isArray(fmt)) return [{t:text, f:''}];
    const out = []; let pos = 0;
    for (const [len, f] of fmt) { out.push({t:text.slice(pos, pos + len), f:normFlags(String(f || ''))}); pos += len; }
    return pos === text.length ? mergeRuns(out) : [{t:text, f:''}];
  }
  const fmtOf = runs => runs.some(r => r.f) ? runs.map(r => [r.t.length, r.f]) : 0;
  function flagsOf(node, block) {
    let f = '';
    for (let n = node.parentNode; n && n !== block; n = n.parentNode) {
      if (n.nodeType !== 1) continue;
      const tag = n.tagName;
      if (tag === 'B' || tag === 'STRONG') f += 'b';
      else if (tag === 'I' || tag === 'EM') f += 'i';
      else if (tag === 'U') f += 'u';
      else if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') f += 's';
      if (n.classList) for (const c of FLAGS) if (n.classList.contains('f' + c)) f += c;
      const st = n.style;
      if (st) {
        if (st.fontWeight === 'bold' || +st.fontWeight >= 600) f += 'b';
        if (st.fontStyle === 'italic') f += 'i';
        const td = (st.textDecorationLine || '') + ' ' + (st.textDecoration || '');
        if (td.includes('underline')) f += 'u';
        if (td.includes('line-through')) f += 's';
      }
    }
    return normFlags(f);
  }
  function readRuns(b) {
    const out = [];
    const w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = w.nextNode())) out.push({t:n.data.replace(/\u200b/g, '').replace(/[\r\n]+/g, ' '), f:flagsOf(n, b)});
    return mergeRuns(out);
  }
  function setRuns(b, runs) {
    runs = mergeRuns(runs.map(r => ({t:r.t.replace(/\u200b/g, '').replace(/[\r\n]+/g, ' '), f:r.f})));
    if (!runs.length) { b.replaceChildren(document.createElement('br')); b.classList.add('blank'); return; }
    b.replaceChildren(...runs.map(r => {
      const tn = document.createTextNode(r.t);
      if (!r.f) return tn;
      const sp = document.createElement('span'); sp.className = clsOf(r.f); sp.append(tn); return sp;
    }));
    b.classList.remove('blank');
  }
  function isCanonical(b, runs) {
    const k = b.childNodes;
    if (!runs.length) return k.length === 1 && k[0].nodeName === 'BR';
    if (k.length !== runs.length) return false;
    for (let i = 0; i < runs.length; i++) {
      const r = runs[i], n = k[i];
      if (!r.f) { if (n.nodeType !== 3 || n.data !== r.t) return false; }
      else if (n.nodeName !== 'SPAN' || n.attributes.length !== 1 || n.className !== clsOf(r.f) ||
               n.childNodes.length !== 1 || n.firstChild.nodeType !== 3 || n.firstChild.data !== r.t) return false;
    }
    return true;
  }
  const setText = (b, t) => setRuns(b, [{t, f:''}]);
  function makeBlock(type, text, manual, fmt) {
    const b = document.createElement('div');
    b.className = 'el';
    b.dataset.type = TYPES.includes(type) ? type : 'action';
    if (manual) b.dataset.manual = '1';
    setRuns(b, runsFrom(text, fmt));
    return b;
  }
  const serialBlock = b => { const r = readRuns(b); return [b.dataset.type, runsText(r), b.dataset.manual ? 1 : 0, fmtOf(r), b.dataset.dual ? 1 : 0]; };

  /* ---------- caret ---------- */
  let savedRange = null;
  function blockOf(node) {
    while (node && node !== editor) {
      if (node.nodeType === 1 && node.parentNode === editor) return node;
      node = node.parentNode;
    }
    return null;
  }
  function posOf(node, offset) {
    if (node === editor) {
      const kids = editor.children;
      if (!kids.length) return null;
      const last = kids[kids.length - 1];
      let n = editor.childNodes[offset];
      while (n && n.nodeType !== 1) n = n.nextSibling;
      return n ? {block:n, off:0} : {block:last, off:txt(last).length};
    }
    const block = blockOf(node);
    if (!block) return null;
    const r = document.createRange();
    r.selectNodeContents(block);
    try { r.setEnd(node, offset); } catch (e) { return {block, off:0}; }
    return {block, off:r.toString().replace(/\u200b/g, '').length};
  }
  function caretInfo() {
    const sel = getSelection();
    if (!sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    if (!editor.contains(r.startContainer)) return null;
    const s = posOf(r.startContainer, r.startOffset);
    if (!s) return null;
    const e = r.collapsed ? s : (posOf(r.endContainer, r.endOffset) || s);
    return {block:s.block, off:s.off, start:s, end:e, collapsed:r.collapsed, cross:s.block !== e.block};
  }
  function nodeAt(b, off) {
    const w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT);
    let n, pos = 0, last = null;
    while ((n = w.nextNode())) { if (off <= pos + n.data.length) return [n, Math.max(0, off - pos)]; pos += n.data.length; last = n; }
    return last ? [last, last.data.length] : [b, 0];
  }
  function setRange(sb, so, eb, eo) {
    const sel = getSelection();
    const r = document.createRange();
    r.setStart(...nodeAt(sb, so)); r.setEnd(...nodeAt(eb, eo));
    sel.removeAllRanges(); sel.addRange(r);
    savedRange = r.cloneRange();
  }
  const setCaret = (b, off) => setRange(b, off, b, off);
  function ensureFocus() {
    if (document.activeElement === editor && caretInfo()) return;
    editor.focus({preventScroll:true});
    const sel = getSelection();
    if (savedRange && editor.contains(savedRange.startContainer)) {
      sel.removeAllRanges(); sel.addRange(savedRange);
    } else {
      const last = editor.lastElementChild;
      setCaret(last, txt(last).length);
    }
  }
  function ensureVisible(b) {
    requestAnimationFrame(() => {
      const vv = window.visualViewport;
      const ot = vv ? vv.offsetTop : 0, vh = vv ? vv.height : innerHeight;
      const sel = getSelection();
      let r = null;
      if (sel.rangeCount) {
        let rr = null; try { rr = sel.getRangeAt(0).getBoundingClientRect(); } catch (e) {}
        if (rr && (rr.height || rr.top)) r = rr;
      }
      if (!r && b) r = b.getBoundingClientRect();
      if (!r) return;
      const minY = ot + hdr.offsetHeight + 12, maxY = ot + vh - 28;
      if (r.bottom > maxY) window.scrollBy(0, r.bottom - maxY);
      else if (r.top < minY) window.scrollBy(0, r.top - minY);
    });
  }

  /* ---------- keep the DOM tidy ---------- */
  let composing = false;
  function normalize() {
    if (composing) return;
    const ci = caretInfo();
    const caretBlock = ci ? ci.block : null, caretOff = ci ? ci.off : 0;
    let wrapped = null;
    for (const n of [...editor.childNodes]) {
      if (n.nodeType === 3) {
        if (!n.data.replace(/\u200b/g, '')) { n.remove(); continue; }
        const b = makeBlock('action', n.data); editor.replaceChild(b, n); wrapped = b;
      } else if (n.nodeType === 1 && !(n.tagName === 'DIV' && n.classList.contains('el'))) {
        if (n.tagName === 'BR') { n.remove(); continue; }
        const b = makeBlock(n.dataset && n.dataset.type, n.textContent); editor.replaceChild(b, n); wrapped = b;
      } else if (n.nodeType !== 1) {
        n.remove();
      }
    }
    for (const b of blocks()) {
      if (!TYPES.includes(b.dataset.type)) b.dataset.type = 'action';
      if (b.hasAttribute('style')) b.removeAttribute('style');
      const runs = readRuns(b);
      if (!isCanonical(b, runs)) { setRuns(b, runs); if (b === caretBlock) setCaret(b, Math.min(caretOff, runsText(runs).length)); }
      else b.classList.toggle('blank', !runs.length);
    }
    if (!editor.children.length) { const b = makeBlock('action', ''); editor.append(b); setCaret(b, 0); }
    else if (!ci && wrapped) setCaret(wrapped, txt(wrapped).length);
  }

  /* ---------- undo history ---------- */
  let hist = [], hi = -1, commitTimer = null;
  function snapshot() {
    const bl = blocks().map(serialBlock);
    const ci = caretInfo();
    return {key:JSON.stringify(bl), bl, caret: ci ? [blocks().indexOf(ci.block), ci.off] : null};
  }
  function commitNow() {
    clearTimeout(commitTimer); commitTimer = null;
    const s = snapshot();
    if (hi >= 0 && hist[hi].key === s.key) { if (s.caret) hist[hi].caret = s.caret; return; }
    hist = hist.slice(0, hi + 1); hist.push(s);
    if (hist.length > 400) hist.shift();
    hi = hist.length - 1;
    updateUndo();
  }
  function scheduleCommit() { clearTimeout(commitTimer); commitTimer = setTimeout(commitNow, 800); }
  function render(bl) {
    editor.replaceChildren(...bl.map(([t, x, m, f, dd]) => { const b = makeBlock(t, x, m, f); if (dd && t === 'character') b.dataset.dual = '1'; return b; }));
    if (!editor.children.length) editor.append(makeBlock('scene', ''));
    schedulePaginate();
  }
  function restore(s) {
    render(s.bl);
    const kids = editor.children;
    const i = s.caret ? Math.max(0, Math.min(s.caret[0], kids.length - 1)) : kids.length - 1;
    const b = kids[i];
    setCaret(b, s.caret ? s.caret[1] : txt(b).length);
    refreshUI(); scheduleSave(); updateUndo(); ensureVisible(b);
  }
  function undo() { commitNow(); if (hi <= 0) return; hi--; restore(hist[hi]); }
  function redo() { commitNow(); if (hi >= hist.length - 1) return; hi++; restore(hist[hi]); }
  function updateUndo() { undoBtn.disabled = hi <= 0; redoBtn.disabled = hi >= hist.length - 1; }

  /* ---------- edits ---------- */
  function edit(fn) {
    commitNow(); fn(); normalize(); refreshUI(); commitNow(); scheduleSave();
    const ci = caretInfo(); if (ci) ensureVisible(ci.block);
  }
  function deleteSelection() {
    const ci = caretInfo(); if (!ci) return;
    const s = ci.start, e = ci.end;
    const sr = readRuns(s.block), er = s.block === e.block ? sr : readRuns(e.block);
    let n = s.block.nextElementSibling;
    if (s.block !== e.block) {
      while (n && n !== e.block) { const nx = n.nextElementSibling; n.remove(); n = nx; }
      e.block.remove();
    }
    setRuns(s.block, [...sliceRuns(sr, 0, s.off), ...sliceRuns(er, e.off)]);
    setCaret(s.block, s.off);
  }
  function splitAtCaret() {
    edit(() => {
      let ci = caretInfo(); if (!ci) return;
      if (!ci.collapsed) { deleteSelection(); ci = caretInfo(); }
      const b = ci.block, runs = readRuns(b), off = ci.off, type = b.dataset.type;
      const atEnd = off >= runsText(runs).length;
      const nb = makeBlock(atEnd ? ENTER_NEXT[type] : type, '', !atEnd && !!b.dataset.manual);
      setRuns(nb, sliceRuns(runs, off));
      setRuns(b, sliceRuns(runs, 0, off));
      b.after(nb);
      setCaret(nb, 0);
    });
  }
  function joinBackward(b) {
    const prev = b.previousElementSibling;
    if (!prev) {
      if (txt(b) === '' && b.dataset.type !== 'action') { b.dataset.type = 'action'; delete b.dataset.manual; }
      setCaret(b, 0); return;
    }
    const pr = readRuns(prev), br = readRuns(b), pl = runsText(pr).length;
    if (!br.length) { b.remove(); setCaret(prev, pl); return; }
    if (!pr.length) { prev.remove(); setCaret(b, 0); return; }
    setRuns(prev, [...pr, ...br]); b.remove(); setCaret(prev, pl);
  }
  function joinForward(b) {
    const next = b.nextElementSibling; if (!next) return;
    const br = readRuns(b), nr = readRuns(next), bl = runsText(br).length;
    if (!nr.length) { next.remove(); setCaret(b, bl); return; }
    if (!br.length) { b.remove(); setCaret(next, 0); return; }
    setRuns(b, [...br, ...nr]); next.remove(); setCaret(b, bl);
  }
  function insertAt(str, flags) {
    let ci = caretInfo(); if (!ci) return;
    if (!ci.collapsed) { deleteSelection(); ci = caretInfo(); }
    const b = ci.block, runs = readRuns(b), off = ci.off;
    const f = flags === undefined ? styleAt(runs, off) : flags;
    const before = sliceRuns(runs, 0, off), after = sliceRuns(runs, off);
    let lines = str.replace(/\r\n?/g, '\n').replace(/\t/g, ' ').split('\n');
    const first = lines.shift();
    lines = lines.map(l => l.trim()).filter(Boolean);
    if (!lines.length) { setRuns(b, [...before, {t:first, f}, ...after]); setCaret(b, off + first.length); return; }
    setRuns(b, [...before, {t:first, f}]);
    let last = b;
    lines.forEach((l, i) => {
      const nb = makeBlock(SCENE_RE.test(l) ? 'scene' : 'action', '');
      setRuns(nb, i === lines.length - 1 ? [{t:l, f:''}, ...after] : [{t:l, f:''}]);
      last.after(nb); last = nb;
    });
    setCaret(last, lines[lines.length - 1].length);
  }

  /* ---------- bold, italic, underline, strikethrough ---------- */
  let pending = null;   // a style switched on or off with nothing selected, used by the next typed text
  function toggleFormat(flag) {
    ensureFocus();
    const ci = caretInfo(); if (!ci) return;
    if (ci.collapsed) {
      if (pending && pending.block === ci.block && pending.off === ci.off) {
        pending.toggle = xorFlags(pending.toggle, flag);
        if (!pending.toggle) pending = null;
      } else pending = {block:ci.block, off:ci.off, toggle:flag};
      refreshUI(); return;
    }
    const s = ci.start, e = ci.end;
    edit(() => {
      const list = [];
      for (let n = s.block; n; n = n.nextElementSibling) { list.push(n); if (n === e.block) break; }
      const span = b => { const r = readRuns(b); return [r, b === s.block ? s.off : 0, b === e.block ? e.off : runsText(r).length]; };
      let all = true, any = false;
      for (const b of list) { const [r, a, z] = span(b); for (const x of sliceRuns(r, a, z)) { any = true; if (!x.f.includes(flag)) all = false; } }
      if (!any) return;
      for (const b of list) {
        const [r, a, z] = span(b);
        const mid = sliceRuns(r, a, z).map(x => ({t:x.t, f:all ? x.f.replace(flag, '') : normFlags(x.f + flag)}));
        setRuns(b, [...sliceRuns(r, 0, a), ...mid, ...sliceRuns(r, z)]);
      }
      setRange(s.block, s.off, e.block, e.off);
    });
  }
  function activeFlags() {
    const ci = caretInfo(); if (!ci) return '';
    let f = styleAt(readRuns(ci.block), ci.off);
    if (!ci.collapsed) { const r = sliceRuns(readRuns(ci.start.block), ci.start.off, ci.start.block === ci.end.block ? ci.end.off : Infinity); if (r.length) f = r[0].f; }
    if (pending && ci.collapsed && pending.block === ci.block && pending.off === ci.off) f = xorFlags(f, pending.toggle);
    return f;
  }
  function applyType(type) {
    ensureFocus();
    const ci = caretInfo(); if (!ci) return;
    edit(() => {
      let n = ci.start.block;
      while (n) { n.dataset.type = type; n.dataset.manual = '1'; if (n === ci.end.block) break; n = n.nextElementSibling; }
    });
  }
  function cycleType(dir) {
    const ci = caretInfo(); if (!ci) return;
    const i = TYPES.indexOf(ci.block.dataset.type);
    applyType(TYPES[(i + dir + TYPES.length) % TYPES.length]);
  }
  function autoScene() {
    const ci = caretInfo(); if (!ci) return;
    const b = ci.block;
    if (b.dataset.type === 'action' && !b.dataset.manual && SCENE_RE.test(txt(b))) b.dataset.type = 'scene';
  }

  /* ---------- toolbar state ---------- */
  let uiQueued = false;
  function requestUI() { if (uiQueued) return; uiQueued = true; requestAnimationFrame(() => { uiQueued = false; refreshUI(); }); }
  function refreshUI() {
    const ci = caretInfo();
    const type = ci ? ci.block.dataset.type : null;
    typeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === type)));
    if (pending && !(ci && ci.collapsed && ci.block === pending.block && ci.off === pending.off)) pending = null;
    const af = ci ? activeFlags() : '';
    fmtBtns.forEach(b => b.setAttribute('aria-pressed', String(af.includes(b.dataset.fmt))));
    if (ci && ci.collapsed) {
      const atEnd = ci.off >= txt(ci.block).length;
      const base = 'Return gives ' + LABELS[atEnd ? ENTER_NEXT[type] : type];
      hintEl.textContent = matchMedia('(pointer: fine)').matches ? base + ', Tab changes type' : base;
    } else hintEl.textContent = '';
    updateSuggest();
  }

  /* ---------- saving on this device ---------- */
  let saveTimer = null, changeSeq = 0;
  let doc = {fileId:null, rev:null, dirty:false};
  // a file's content revision: changes only when the script itself changes
  const revOf = m => String(m.headRevisionId || m.modifiedTime || '');
  const setStatus = s => { statusEl.textContent = s; };
  const TP_DEFAULT = () => ({credit:'Written by', author:'', source:'', contact:'', draft:''});
  let titlePage = TP_DEFAULT();
  let settings = {sceneNumbers:false}, drafts = [];
  const currentData = () => ({app:'script-editor', v:1, title:titleEl.value, titlePage:{...titlePage}, settings:{...settings}, drafts,
    blocks:blocks().map(serialBlock)});
  const hasContent = d => !!(d.title.trim() || d.blocks.some(b => b[1].trim()));
  function scheduleSave() {
    doc.dirty = true; changeSeq++; schedulePaginate();
    setStatus(driveState === 'on' ? 'Saving to Drive…' : 'Saving…');
    clearTimeout(saveTimer); saveTimer = setTimeout(saveLocal, 500);
    scheduleDrive();
  }
  function saveLocal() {
    clearTimeout(saveTimer);
    const d = currentData();
    const data = {v:1, title:d.title, titlePage:d.titlePage, settings:d.settings, drafts:d.drafts, blocks:d.blocks, doc, savedAt:Date.now()};
    try { localStorage.setItem(KEY, JSON.stringify(data)); if (driveState !== 'on') setStatus('Saved on this device'); }
    catch (e) { if (driveState !== 'on') setStatus('Not saved: this browser blocks storage'); }
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      return d && Array.isArray(d.blocks) && d.blocks.length ? d : null;
    } catch (e) { return null; }
  }

  /* ---------- PDF ---------- */

      const y = PAGE.h - PAGE.top - (i + 1) * PAGE.lh + 2.6;
      if (l.sn && opts.sceneNumbers) {
        const t = String(l.sn);
        ops.push(`BT /F1 12 Tf ${(PAGE.left - 40 - t.length * PAGE.cw).toFixed(2)} ${y.toFixed(2)} Td (${t}) Tj ET`);
        ops.push(`BT /F1 12 Tf ${(PAGE.left + PAGE.cols * PAGE.cw + 18).toFixed(2)} ${y.toFixed(2)} Td (${t}) Tj ET`);
      }

  /* ---------- export to Final Draft (.fdx) ---------- */
  const FDX_TYPE = {scene:'Scene Heading', action:'Action', character:'Character', paren:'Parenthetical',

  function toFdx(d) {

    const numbered = !!(d.settings && d.settings.sceneNumbers);
    let sp = -1, sceneNo = 0;
    for (const [type, raw, , fmt, dd] of d.blocks) {

      if (type === 'character') { sp = speeches.length; speeches.push({dual:!!dd}); }

      while (runs.length && !runs[runs.length - 1].t.trim()) runs.pop();
      if (!runs.length) continue;
      runs[0] = {...runs[0], t:runs[0].t.replace(/^\s+/, '')};
      runs[runs.length - 1] = {...runs[runs.length - 1], t:runs[runs.length - 1].t.replace(/\s+$/, '')};
      if (CAPS.has(type)) runs = runs.map(r => ({...r, t:r.t.toUpperCase()}));
      if (type === 'paren' && !/^\(.*\)$/.test(runsText(runs))) {
        runs[0] = {...runs[0], t:runs[0].t.replace(/^\(/, '')};
        runs[runs.length - 1] = {...runs[runs.length - 1], t:runs[runs.length - 1].t.replace(/\)$/, '')};

        : `<Text>${xmlEsc(r.t)}</Text>`).join('');

  /* ---------- Fountain (.fountain) ---------- */
  function fountainText(runs) {

      if (type === 'note') line = '[[' + plain + ']]';
      else if (type === 'scene') { sceneNo++; line = (SCENE_RE.test(plain) ? '' : '.') + fountainText(runs).toUpperCase() + (numbered ? ` #${sceneNo}#` : ''); }
      else if (type === 'character') line = (/[A-Za-z]/.test(plain) ? '' : '@') + fountainText(runs).toUpperCase() + (dd ? ' ^' : '');
      else if (type === 'paren') line = /^\(.*\)$/.test(plain) ? fountainText(runs) : '(' + fountainText(runs) + ')';
      else if (type === 'dialogue') line = fountainText(runs);
      else if (type === 'transition') line = (/TO:$/i.test(plain) ? '' : '> ') + fountainText(runs).toUpperCase();
      else if (type === 'shot') line = '!' + fountainText(runs).toUpperCase();
      else line = (plain === plain.toUpperCase() && /[A-Z]/.test(plain)) || SCENE_RE.test(plain) ? '!' + fountainText(runs) : fountainText(runs);
      const inSpeech = (type === 'paren' || type === 'dialogue') && (prev === 'character' || prev === 'paren' || prev === 'dialogue');
      if (!inSpeech && out.length && out[out.length - 1] !== '') out.push('');
      out.push(line);
      prev = type === 'note' ? prev : type;
    }
    return out.join('\n') + '\n';
  }
  function fountainRuns(s) {
    s = s.replace(/\[\[[\s\S]*?\]\]/g, '');
    const out = []; let b = false, i = false, u = false, buf = '';
    const push = () => { if (buf) { out.push({t:buf, f:normFlags((b ? 'b' : '') + (i ? 'i' : '') + (u ? 'u' : ''))}); buf = ''; } };
    for (let k = 0; k < s.length; k++) {
      const c = s[k];
      if (c === '\\' && k + 1 < s.length) { buf += s[++k]; continue; }
      if (c === '*') { let n = 1; while (s[k + n] === '*' && n < 3) n++; push(); if (n === 3) { b = !b; i = !i; } else if (n === 2) b = !b; else i = !i; k += n - 1; continue; }
      if (c === '_') { push(); u = !u; continue; }
      buf += c;
    }
    push();
    return trimRuns(mergeRuns(out));
  }
  function fromFountain(text) {
    text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').replace(/\/\*[\s\S]*?\*\//g, '');
    let lines = text.split('\n');
    const tp = TP_DEFAULT(); let title = '';
    if (/^[A-Za-z][A-Za-z ]*:/.test(lines[0] || '')) {
      const vals = {}; let key = null, i = 0;
      for (; i < lines.length && lines[i].trim(); i++) {
        const l = lines[i], m = l.match(/^([A-Za-z][A-Za-z ]*):\s*(.*)$/);
        if (m && !/^(\s{2,}|\t)/.test(l)) { key = m[1].toLowerCase(); vals[key] = m[2].trim(); }
        else if (key) vals[key] = (vals[key] ? vals[key] + '\n' : '') + l.trim();
      }
      lines = lines.slice(i);
      const clean = v => runsText(fountainRuns(v || '')).trim();
      title = clean(vals.title).replace(/\n/g, ' ');
      if (vals.credit) tp.credit = clean(vals.credit);
      tp.author = clean(vals.author || vals.authors);
      tp.source = clean(vals.source);
      tp.contact = (vals.contact || '').split('\n').map(x => clean(x)).filter(Boolean).join('\n');
      tp.draft = [vals['draft date'], vals.notes].filter(Boolean).map(clean).join('\n');
    }
    const paras = []; let cur = [];
    for (const l of lines) { if (!l.trim() && l !== '  ') { if (cur.length) paras.push(cur); cur = []; } else cur.push(l.replace(/\s+$/, '')); }
    if (cur.length) paras.push(cur);
    const blocks = [];
    const add = (type, s, dual) => { const r = fountainRuns(s); if (r.length) blocks.push([type, runsText(r), 1, fmtOf(r), dual ? 1 : 0]); };
    const isChar = l => { const t = l.replace(/\^\s*$/, '').trim(); if (t.startsWith('@')) return true; if (t.startsWith('!')) return false; const base = t.replace(/\([^)]*\)/g, ''); return /[A-Z]/.test(base) && !/[a-z]/.test(base); };
    for (const p of paras) {
      const first = p[0].trim(), whole = p.map(x => x.trim()).join(' ');
      if (/^={3,}$/.test(first)) continue;
      if (/^#/.test(first)) { add('note', first.replace(/^#+\s*/, '')); continue; }
      if (/^=(?!=)/.test(first)) { add('note', first.replace(/^=\s*/, '')); continue; }
      if (/^\[\[[\s\S]*\]\]$/.test(whole)) { const t = whole.slice(2, -2).trim(); if (t) blocks.push(['note', t, 1, 0, 0]); continue; }
      if (p.length === 1 && (/^\.(?!\.)/.test(first) || SCENE_RE.test(first))) { add('scene', first.replace(/^\./, '').replace(/\s*#[^#]+#\s*$/, '')); continue; }
      if (p.length === 1 && /^>/.test(first) && !/<$/.test(first)) { add('transition', first.replace(/^>\s*/, '')); continue; }
      if (p.length === 1 && /^[^a-z]+TO:$/.test(first)) { add('transition', first); continue; }
      if (p.length > 1 && isChar(first)) {
        const dual = /\^\s*$/.test(first);
        add('character', first.replace(/\^\s*$/, '').replace(/^@/, '').trim(), dual);
        let dlg = [];
        const flush = () => { if (dlg.length) add('dialogue', dlg.join(' ')); dlg = []; };
        for (const l of p.slice(1)) { const t = l.trim(); if (/^\(.*\)$/.test(t)) { flush(); add('paren', t); } else if (t) dlg.push(t); }
        flush();
        continue;
      }
      add('action', p.map(x => x.trim().replace(/^!/, '').replace(/^>\s*(.*?)\s*<$/, '$1')).join(' '));
    }
    return {title, blocks, titlePage:tp};
  }
  document.getElementById('fountainBtn').addEventListener('click', () => {
    const d = currentData();
    if (!hasContent(d)) { setStatus('Nothing to download yet'); return; }
    const name = (d.title.trim() || 'Untitled script').replace(/[\\/:*?"<>|]+/g, '-') + '.fountain';
    saveBlob(new TextEncoder().encode(toFountain(d)), name, 'application/octet-stream');
    closePicker();
  });
  Object.assign(window.__script, {toFountain, fromFountain});

  /* ---------- side toolbars (iPad) and full screen ---------- */
  const RAIL_KEY = 'script-editor:rails';
  const railL = document.getElementById('railL'), railR = document.getElementById('railR');
  const rowMain = document.getElementById('rowMain'), rowTypes = document.getElementById('rowTypes');
  const fullBtn = document.getElementById('fullBtn');
  const isIOSDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const pair = el('div', {className:'pair'});
  const label = t => el('div', {className:'rail-label', textContent:t});
  // every tool as its own button in the left bar, so nothing hides behind the Tools menu
  const RAIL_TOOLS = [['find', 'Find'], ['scenes', 'Scenes'], ['reports', 'Reports'], ['drafts', 'Drafts'], ['dual', 'Dual dialogue'], ['numbers', 'Scene numbers'], ['rails', 'Top toolbar']];
  const railTools = RAIL_TOOLS.map(([tool, text]) => {
    const b = el('button', {className:'textbtn tool-b', textContent:text});
    b.dataset.tool = tool;
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => { document.querySelector(`#toolsSheet [data-tool="${tool}"]`).click(); railLabels(); });
    return b;
  });
  function railLabels() {
    const n = railTools.find(b => b.dataset.tool === 'numbers');
    n.textContent = 'Scene numbers: ' + (settings.sceneNumbers ? 'on' : 'off');
  }
  const movable = [titleEl, document.getElementById('pages'), statusEl, undoBtn, redoBtn, document.querySelector('.fmt'),
    document.querySelector('.types'), openBtn, document.getElementById('toolsBtn'), newBtn, driveBtn, fullBtn];
  const homes = new Map(movable.map(n => { const ph = document.createComment(''); n.before(ph); return [n, ph]; }));
  let railsOn = false;
  function railPref() { try { return localStorage.getItem(RAIL_KEY); } catch (e) { return null; } }
  function wantRails() {
    if (innerWidth < 700) return false;                       // too narrow for two side bars
    const p = railPref();
    return p === null ? isIOSDevice : p === '1';
  }
  function setRails(on) {
    if (on === railsOn) return;
    railsOn = on;
    document.documentElement.classList.toggle('rails', on);
    railL.hidden = railR.hidden = !on;
    rowMain.hidden = rowTypes.hidden = on;
    if (on) {
      pair.replaceChildren(undoBtn, redoBtn);
      railL.replaceChildren(pair, label('Style'), document.querySelector('.fmt'), label('Line'), document.querySelector('.types'),
        label('Tools'), ...railTools);
      railLabels();
      railR.replaceChildren(titleEl, document.getElementById('pages'), statusEl, openBtn, newBtn, driveBtn, fullBtn);
    } else {
      movable.forEach(n => homes.get(n).after(n));
      railL.replaceChildren(); railR.replaceChildren();
    }
    syncHeader(); pin();
    document.getElementById('railState').textContent = on ? 'On' : 'Off';
    document.getElementById('toolsBtn').hidden = on;
  }
  // with side bars the top bar only appears for find and replace, or a save warning
  function syncHeader() { hdr.hidden = railsOn && findBar.hidden && conflictRow.hidden; measure(); }
  new MutationObserver(syncHeader).observe(findBar, {attributes:true, attributeFilter:['hidden']});
  new MutationObserver(syncHeader).observe(conflictRow, {attributes:true, attributeFilter:['hidden']});
  window.addEventListener('resize', () => setRails(wantRails()));
  function toggleRails() {
    const next = !railsOn;
    try { localStorage.setItem(RAIL_KEY, next ? '1' : '0'); } catch (e) {}
    if (next && innerWidth < 700) setStatus('The screen is too narrow for side toolbars');
    setRails(wantRails());
    toolsSheet.hidden = true;
  }

  // Full screen hides Safari's own bars, where the browser allows it
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const canFull = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  fullBtn.hidden = !canFull;
  function toggleFull() {
    const d = document, root = d.documentElement;
    try {
      if (fsEl()) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      const p = req && req.call(root);
      if (p && p.catch) p.catch(() => setStatus('Safari didn’t allow full screen here'));
    } catch (e) { setStatus('Safari didn’t allow full screen here'); }
  }
  function syncFull() {
    const on = !!fsEl();
    fullBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
    fullBtn.title = on ? 'Exit full screen' : 'Full screen';
    fullBtn.innerHTML = on
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  }
  fullBtn.addEventListener('pointerdown', e => e.preventDefault());
  fullBtn.addEventListener('mousedown', e => e.preventDefault());
  fullBtn.addEventListener('click', toggleFull);
  document.addEventListener('fullscreenchange', syncFull);
  document.addEventListener('webkitfullscreenchange', syncFull);

  /* ---------- events ---------- */
  editor.addEventListener('beforeinput', e => {
    const it = e.inputType;
    if (it === 'historyUndo') { e.preventDefault(); undo(); return; }
    if (it === 'historyRedo') { e.preventDefault(); redo(); return; }
    const FMT = {formatBold:'b', formatItalic:'i', formatUnderline:'u', formatStrikeThrough:'s'};
    if (FMT[it]) { e.preventDefault(); toggleFormat(FMT[it]); return; }
    if (e.isComposing) return;
    const ci = caretInfo(); if (!ci) return;
    if ((it === 'insertParagraph' || it === 'insertLineBreak') && sug && sug.idx >= 0) { e.preventDefault(); acceptSuggest(sug.idx); return; }
    if (it === 'insertParagraph' || it === 'insertLineBreak') { e.preventDefault(); splitAtCaret(); return; }
    if (it === 'insertText' && ci.collapsed && e.data && pending && pending.block === ci.block && pending.off === ci.off) {
      e.preventDefault();
      const f = xorFlags(styleAt(readRuns(ci.block), ci.off), pending.toggle);
      pending = null;
      edit(() => insertAt(e.data, f));
      return;
    }
    if (it.startsWith('delete')) {
      if (!ci.collapsed) { if (ci.cross) { e.preventDefault(); edit(deleteSelection); } return; }
      const len = txt(ci.block).length;
      if (it.includes('Backward') && ci.off === 0) { e.preventDefault(); edit(() => joinBackward(ci.block)); }
      else if (it.includes('Forward') && ci.off >= len) { e.preventDefault(); edit(() => joinForward(ci.block)); }
      return;
    }
    if (it === 'insertText' && !ci.collapsed && ci.cross) {
      e.preventDefault(); const d = e.data || '';
      edit(() => { deleteSelection(); if (d) insertAt(d); });
    }
  });

  editor.addEventListener('input', e => {
    if (e.isComposing || composing) { scheduleSave(); return; }
    normalize();
    if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') {
      // fallback if the browser split the line itself
      const ci = caretInfo();
      if (ci) {
        const prev = ci.block.previousElementSibling;
        if (prev && txt(ci.block) === '') { ci.block.dataset.type = ENTER_NEXT[prev.dataset.type]; delete ci.block.dataset.manual; }
      }
    }
    autoScene(); refreshUI(); scheduleCommit(); scheduleSave();
    const ci = caretInfo(); if (ci) ensureVisible(ci.block);
  });

  editor.addEventListener('compositionstart', () => { composing = true; });
  editor.addEventListener('compositionend', () => {
    composing = false; normalize(); autoScene(); refreshUI(); scheduleCommit(); scheduleSave();
  });

  editor.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    const mod = e.metaKey || e.ctrlKey;
    if (sug && !mod && !e.altKey) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSuggest(e.key === 'ArrowDown' ? 1 : -1); return; }
      if ((e.key === 'Enter' || e.key === 'Tab') && sug.idx >= 0 && !e.shiftKey) { e.preventDefault(); acceptSuggest(sug.idx); return; }
      if (e.key === 'Escape') { e.preventDefault(); dismissSuggest(); return; }
    }
    if (e.key === 'Tab') { e.preventDefault(); cycleType(e.shiftKey ? -1 : 1); return; }
    if (mod && !e.altKey && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && !e.altKey && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (mod && !e.altKey && !e.shiftKey && /^[biu]$/i.test(e.key)) { e.preventDefault(); toggleFormat(e.key.toLowerCase()); return; }
    if (mod && e.shiftKey && !e.altKey && e.code === 'KeyX') { e.preventDefault(); toggleFormat('s'); return; }
    if (e.altKey && !mod && /^Digit[1-8]$/.test(e.code)) { e.preventDefault(); applyType(TYPES[+e.code.slice(5) - 1]); }
  });

  editor.addEventListener('paste', e => {
    e.preventDefault();
    const s = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
    if (s) edit(() => insertAt(s));
  });
  editor.addEventListener('drop', e => e.preventDefault());

  document.addEventListener('selectionchange', () => {
    const sel = getSelection();
    if (sel.rangeCount && editor.contains(sel.getRangeAt(0).startContainer)) savedRange = sel.getRangeAt(0).cloneRange();
    requestUI();
  });

  // Buttons must not steal the keyboard from the script
  const keepFocus = el => {
    el.addEventListener('pointerdown', e => e.preventDefault());
    el.addEventListener('mousedown', e => e.preventDefault());
  };
  const ALT = /Mac|iPhone|iPad/.test(navigator.platform) ? 'Option' : 'Alt';
  typeBtns.forEach((btn, i) => { btn.title = `${LABELS[btn.dataset.type]} (${ALT}+${i + 1})`; });
  typeBtns.forEach(btn => { keepFocus(btn); btn.addEventListener('click', () => applyType(btn.dataset.type)); });
  keepFocus(undoBtn); keepFocus(redoBtn);
  const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? 'Cmd' : 'Ctrl';
  const FMT_TIP = {b:'Bold (' + MOD + '+B)', i:'Italic (' + MOD + '+I)', u:'Underline (' + MOD + '+U)', s:'Strikethrough (' + MOD + '+Shift+X)'};
  fmtBtns.forEach(btn => { btn.title = FMT_TIP[btn.dataset.fmt]; keepFocus(btn); btn.addEventListener('click', () => toggleFormat(btn.dataset.fmt)); });
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  let armTimer = null;
  function disarm() { clearTimeout(armTimer); newBtn.classList.remove('armed'); newBtn.textContent = 'New'; }
  newBtn.addEventListener('click', async () => {
    if (!newBtn.classList.contains('armed')) {
      newBtn.classList.add('armed'); newBtn.textContent = 'Tap again to start new';
      armTimer = setTimeout(disarm, 3000); return;
    }
    disarm();
    if (driveState === 'reconnect' && doc.dirty && hasContent(currentData())) {
      setStatus('Reconnect Drive first so this script is saved'); return;
    }
    if (driveState === 'on' && !(await flushCurrent())) {
      setStatus('Current script isn’t in Drive yet. Try again in a moment'); return;
    }
    const linked = !!doc.fileId;
    commitNow();
    render([['scene', '', 0]]); titleEl.value = '';
    titlePage = {...TP_DEFAULT(), credit:titlePage.credit, author:titlePage.author, contact:titlePage.contact};
    settings = {sceneNumbers:false}; drafts = [];
    renderTpCard();
    doc = {fileId:null, rev:null, dirty:false};
    if (linked) resetHistory(); else commitNow();
    editor.focus(); setCaret(editor.firstElementChild, 0);
    refreshUI(); saveLocal(); window.scrollTo(0, 0);
    if (driveState === 'on') setStatus('New script');
  });

  /* ---------- title page ---------- */
  const tpSheet = document.getElementById('tpSheet');
  const tpTitle = document.getElementById('tpTitle');
  const tpFields = {credit:'tpCredit', author:'tpAuthor', source:'tpSource', contact:'tpContact', draft:'tpDraft'};
  for (const k in tpFields) tpFields[k] = document.getElementById(tpFields[k]);
  function renderTpCard() {
    const t = titleEl.value.trim(), a = titlePage.author.trim();
    document.getElementById('tpCardTitle').textContent = t;
    document.getElementById('tpCardCredit').textContent = a ? (titlePage.credit.trim() || 'Written by') : '';
    document.getElementById('tpCardAuthor').textContent = a;
    document.getElementById('tpCardEmpty').hidden = !!(t || a);
  }
  function openTitlePage() {
    tpTitle.value = titleEl.value;
    for (const k in tpFields) tpFields[k].value = titlePage[k] || '';
    tpSheet.hidden = false;
  }
  function closeTitlePage() { tpSheet.hidden = true; saveLocal(); }
  tpTitle.addEventListener('input', () => { titleEl.value = tpTitle.value; renderTpCard(); scheduleSave(); });
  for (const k in tpFields) tpFields[k].addEventListener('input', () => { titlePage[k] = tpFields[k].value; renderTpCard(); scheduleSave(); });
  document.getElementById('tpCard').addEventListener('click', openTitlePage);
  document.getElementById('tpDone').addEventListener('click', closeTitlePage);
  tpSheet.addEventListener('click', e => { if (e.target === tpSheet) closeTitlePage(); });

  titleEl.addEventListener('input', () => { renderTpCard(); scheduleSave(); });
  titleEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const f = editor.firstElementChild; editor.focus(); setCaret(f, txt(f).length); }
  });

  // Tapping the empty page below the script continues writing at the end
  document.querySelector('main').addEventListener('click', e => {
    if (editor.contains(e.target) || e.target.closest('.tp-card')) return;
    const last = editor.lastElementChild;
    editor.focus(); setCaret(last, txt(last).length); ensureVisible(last); refreshUI();
  });

  window.addEventListener('pagehide', saveLocal);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { saveLocal(); if (driveState === 'on' && doc.dirty) saveToDrive(true); }
    else checkRemote();
  });

  /* ---------- header that stays put above the iPad keyboard ---------- */
  const measure = () => document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px');
  if ('ResizeObserver' in window) new ResizeObserver(measure).observe(hdr);
  measure();
  const vv = window.visualViewport;
  function pin() {
    const y = vv ? Math.max(0, vv.offsetTop) : 0;
    hdr.style.transform = y ? `translateY(${y}px)` : '';
    for (const r of [railL, railR]) {
      r.style.transform = y ? `translateY(${y}px)` : '';
      r.style.height = vv ? vv.height + 'px' : '';
    }
  }
  if (vv) { vv.addEventListener('scroll', pin); vv.addEventListener('resize', pin); }

  /* ---------- start ---------- */
  try { document.execCommand('defaultParagraphSeparator', false, 'div'); } catch (e) {}
  const saved = load();
  if (saved) {
    titleEl.value = saved.title || ''; render(saved.blocks);
    titlePage = {...TP_DEFAULT(), ...(saved.titlePage || {})};
    settings = {sceneNumbers:false, ...(saved.settings || {})}; drafts = Array.isArray(saved.drafts) ? saved.drafts : [];
    const d = saved.doc || {};
    doc = {fileId:d.fileId || null, rev:d.rev || null, dirty:saved.doc ? (!!d.dirty || !d.rev) : true};
  } else render([['scene', '', 0]]);
  commitNow(); updateUndo(); refreshUI(); renderTpCard();
  setRails(wantRails());
  driveState = tokenValid() ? 'on' : (wasConnected() ? 'reconnect' : 'off');
  updateDriveUI();
  if (driveState === 'on') syncNow();
  else setStatus(saved ? 'Saved on this device' : '');
})();
</script>
</body>
</html>
